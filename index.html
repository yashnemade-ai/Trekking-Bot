<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrekMate AI Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: 70vh; }
        .message { max-width: 80%; margin-bottom: 12px; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center p-5">
    <div class="w-full max-w-2xl bg-white shadow-xl rounded-lg overflow-hidden mt-10">
        <div class="bg-green-600 p-4 text-white text-xl font-bold text-center">
            🥾 TrekMate AI Assistant
        </div>
        
        <div id="chat-window" class="chat-container p-4 overflow-y-auto flex flex-col bg-gray-50 border-b">
            <div class="bg-gray-200 text-gray-800 message self-start">
                Hello! Main aapka trekking guide hoon. Aap kya poochna chahte hain?
            </div>
        </div>

        <div class="p-4 flex gap-2">
            <input type="text" id="userInput" class="flex-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Ask something about treks...">
            <button onclick="askAI()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">Send</button>
        </div>
    </div>

    <script>
        // Aapka Render Backend URL
        const BACKEND_URL = "https://trekking-bot-r0qe.onrender.com"; 

        async function askAI() {
            const input = document.getElementById('userInput');
            const chatWindow = document.getElementById('chat-window');
            const question = input.value.trim();
            
            if(!question) return;

            // User ka message dikhana
            chatWindow.innerHTML += `<div class="bg-green-500 text-white message self-end shadow-sm">${question}</div>`;
            input.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                // Backend ko call karna (/chat endpoint par)
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ question: question })
                });
                
                const data = await response.json();
                
                // AI ka reply dikhana
                chatWindow.innerHTML += `<div class="bg-white text-gray-800 message self-start border shadow-sm">
                    <b>TrekMate:</b><br>${data.answer}
                </div>`;
            } catch (error) {
                chatWindow.innerHTML += `<div class="text-red-500 text-center text-sm italic">Error: Backend se connection nahi ho paya.</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Enter key se send karne ke liye
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') askAI();
        });
    </script>
</body>
</html>
